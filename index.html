<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebahan Majlis Cherie' Rouge Gala 2026</title>
<style>
:root{--cherry:#8c0f2b;--cherry-d:#5e0a1d;--oat:#f1e6d2;--oat-d:#e2d2b5;--gold:#c9a24b;--gold-l:#e8cf8a;--ink:#4a1020;--h:min(86dvh,calc((100vw - 20px)/0.62),980px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#4a0c1c 0%,#1d0610 70%);color:var(--ink);font-family:Georgia,"Palatino Linotype",Palatino,serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{perspective:2200px;height:var(--h);width:calc(var(--h)*0.62);position:relative}
.book{position:absolute;inset:0;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55))}
.page{position:absolute;inset:0;transform-origin:left center;transition:transform 1.25s cubic-bezier(.45,.05,.25,1),opacity .55s ease .7s;border-radius:6px 14px 14px 6px;background:var(--oat);overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 6px 0 14px rgba(0,0,0,.18)}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);opacity:0;transition:opacity 1.1s ease}
.page.turned{transform:rotateY(-172deg);opacity:0}
.page.turned::after{opacity:1}
.page.gone{visibility:hidden}
.frame{position:absolute;inset:10px;border:2px solid var(--gold);border-radius:8px;pointer-events:none}
.frame::after{content:"";position:absolute;inset:4px;border:1px solid rgba(201,162,75,.55);border-radius:5px}
.head{margin:26px 22px 8px;padding:10px 14px;background:linear-gradient(180deg,var(--cherry),var(--cherry-d));color:var(--oat);border-radius:10px;text-align:center;box-shadow:0 2px 0 var(--gold) inset,0 0 0 1px var(--gold-l) inset}
.head small{display:block;letter-spacing:.28em;font-size:clamp(9px,2.3vw,12px);color:var(--gold-l);text-transform:uppercase}
.head h2{margin:2px 0 0;font-size:clamp(18px,5.4vw,30px);font-style:italic;font-weight:600}
.media{flex:1;min-height:0;margin:6px 24px 8px;display:flex;align-items:center;justify-content:center;position:relative}
.media video,.media img{max-width:100%;max-height:100%;border-radius:10px;border:2px solid var(--gold);background:#000;box-shadow:0 6px 16px rgba(60,10,20,.35)}
.media img{cursor:zoom-in;background:var(--oat-d)}
.cap{margin:0 26px 26px;text-align:center;font-size:clamp(11px,3.1vw,15px);color:var(--cherry-d);font-style:italic;min-height:1.4em}
.cover{background:linear-gradient(145deg,#a3132f,#6d0b21 60%,#560919);color:var(--oat);align-items:center;text-align:center;justify-content:center;padding:34px 26px}
.cover .frame{border-color:var(--gold-l)}
.cover .org{letter-spacing:.4em;color:var(--gold-l);font-size:clamp(10px,2.8vw,14px)}
.cover .maj{margin-top:14px;letter-spacing:.5em;color:var(--gold-l);font-size:clamp(12px,3.4vw,17px)}
.cover h1{margin:6px 0;font-size:clamp(38px,12.5vw,70px);line-height:1;font-style:italic;font-weight:500;color:var(--oat);text-shadow:0 2px 8px rgba(0,0,0,.35)}
.cover .g{color:var(--gold-l);letter-spacing:.3em;font-size:clamp(15px,4.6vw,24px)}
.orn{color:var(--gold);margin:10px 0;letter-spacing:.5em;font-size:clamp(12px,3.4vw,16px)}
.toc{display:grid;gap:7px;width:100%;margin-top:6px}
.toc button{font:inherit;cursor:pointer;color:var(--oat);background:rgba(255,255,255,.08);border:1px solid var(--gold);border-radius:999px;padding:8px 14px;font-size:clamp(12px,3.5vw,16px);text-align:left;display:flex;gap:10px;align-items:center}
.toc button b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:var(--cherry-d);font-size:.85em}
.hint{margin-top:12px;font-size:clamp(10px,2.8vw,13px);color:var(--gold-l);font-style:italic}
.end{align-items:center;justify-content:center;text-align:center;padding:30px}
.end .t{font-size:clamp(34px,11vw,60px);font-style:italic;color:var(--cherry);margin:6px 0}
.end p{margin:4px 0;font-size:clamp(13px,3.8vw,18px)}
.nav{display:flex;align-items:center;gap:14px;margin-top:10px;color:var(--oat)}
.nav button{font:inherit;cursor:pointer;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(255,255,255,.07);color:var(--gold-l);font-size:22px;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}
.nav span{min-width:64px;text-align:center;font-size:14px;letter-spacing:.1em;color:var(--gold-l)}
.lb{position:fixed;inset:0;background:rgba(20,4,10,.94);z-index:50;display:none;flex-direction:column}
.lb.on{display:flex}
.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--gold-l);font-size:14px}
.lb .bar button{font:inherit;color:var(--oat);background:var(--cherry);border:1px solid var(--gold);border-radius:999px;padding:8px 18px;cursor:pointer}
.lb .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.lb img{width:100%;height:auto;margin:auto;display:block;cursor:zoom-in}
.lb.z img{width:260%;max-width:none;cursor:zoom-out;margin:0}
</style>
</head>
<body>
<div class="stage"><div class="book" id="book"></div></div>
<div class="nav"><button id="prev" aria-label="Sebelum">&#8249;</button><span id="lbl"></span><button id="next" aria-label="Seterusnya">&#8250;</button></div>
<div class="lb" id="lb"><div class="bar"><span id="lbhint">Ketik gambar untuk zum</span><button id="lbx">Tutup</button></div><div class="sc"><img id="lbi" alt=""></div></div>
<script>
(function(){
var P=[
{t:'cover'},
{n:'1',title:'Kad Jemputan',v:'media/jemputan.mp4',p:'img/p_jemputan.jpg',cap:'Tekan butang main untuk menonton video'},
{n:'2',title:'Tempat Parking',v:'media/parking.mp4',p:'img/p_parking.jpg',cap:'Tonton video untuk panduan tempat parking'},
{n:'3',title:'Lokasi Surau',v:'media/surau.mp4',p:'img/p_surau.jpg',cap:'Tonton video untuk panduan ke surau'},
{n:'4',title:'OOTD Outdoor',i:'img/ootd_luar.jpg',cap:'Ketik gambar untuk zum'},
{n:'4',title:'OOTD Indoor',i:'img/ootd_dalam.jpg',cap:'Ketik gambar untuk zum'},
{n:'5',title:'Nombor Meja',i:'img/meja.jpg',cap:'Ketik gambar untuk zum dan semak nama anda'},
{t:'end'}
];
var book=document.getElementById('book'),els=[],cur=0,busy=false;
function toc(){return [['1','Kad Jemputan',1],['2','Tempat Parking',2],['3','Lokasi Surau',3],['4','OOTD',4],['5','Nombor Meja',6]].map(function(a){return '<button data-go="'+a[2]+'"><b>'+a[0]+'</b>'+a[1]+'</button>'}).join('')}
P.forEach(function(d,k){
var e=document.createElement('section');e.className='page';e.style.zIndex=P.length-k;
if(d.t==='cover'){e.classList.add('cover');e.innerHTML='<div class="frame"></div><div class="org">SK LANGKAWI</div><div class="maj">M A J L I S</div><h1>Cherie&rsquo; Rouge</h1><div class="g">GALA 2026</div><div class="orn">&#10048; &#9830; &#10048;</div><div class="toc">'+toc()+'</div><div class="hint">Selak ke halaman seterusnya &rsaquo;</div>'}
else if(d.t==='end'){e.classList.add('end');e.innerHTML='<div class="frame"></div><div class="orn">&#10048; &#9830; &#10048;</div><div class="t">Terima Kasih</div><p>Kehadiran anda amat dialu-alukan</p><p>Khamis, 26 November 2026</p><p>The Chamber Ballroom, Dash Hotel, Langkawi</p><div class="orn">&#10048; &#9830; &#10048;</div>'}
else{var m=d.v?'<video controls playsinline preload="metadata" poster="'+d.p+'" src="'+d.v+'"></video>':'<img src="'+d.i+'" alt="'+d.title+'" data-zoom="1">';
e.innerHTML='<div class="frame"></div><div class="head"><small>Hebahan '+d.n+'</small><h2>'+d.title+'</h2></div><div class="media">'+m+'</div><div class="cap">'+d.cap+'</div>'}
book.appendChild(e);els.push(e)});
function sync(){els.forEach(function(e,k){e.classList.toggle('turned',k<cur);if(k>=cur)e.classList.remove('gone');e.style.pointerEvents=(k===cur)?'auto':'none'});
document.getElementById('lbl').textContent=(cur+1)+' / '+P.length;
document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===P.length-1;
document.querySelectorAll('video').forEach(function(v){try{v.pause()}catch(x){}})}
function go(n){if(busy||n<0||n>=P.length||n===cur)return;busy=true;
if(n>cur){cur=n}else{cur=n}
sync();setTimeout(function(){els.forEach(function(e,k){if(k<cur)e.classList.add('gone')});busy=false},1300)}
function step(d){var n=cur+d;if(n<0||n>=P.length)return;busy=false;go(n)}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
book.addEventListener('click',function(ev){var b=ev.target.closest('[data-go]');if(b){go(+b.getAttribute('data-go'));return}
var im=ev.target.closest('[data-zoom]');if(im){var lb=document.getElementById('lb');document.getElementById('lbi').src=im.src;lb.classList.remove('z');lb.classList.add('on')}});
var lb=document.getElementById('lb');
document.getElementById('lbx').onclick=function(){lb.classList.remove('on','z')};
document.getElementById('lbi').onclick=function(){lb.classList.toggle('z')};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')lb.classList.remove('on','z')});
var sx=null,sy=null;
book.addEventListener('touchstart',function(e){if(e.target.closest('video'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)step(dx<0?1:-1)},{passive:true});
sync();
})();
</script>
</body>
</html>
